# MeNo Messenger — self-hosted стек (Этапы 1.6, 3.2, 3.5 ТЗ).
#
# Состав: app (FastAPI) + db (PostgreSQL) + redis (кеш/лимитеры/WS-шина) + minio (S3).
# Запуск:
#   1) Скопируйте .env.example в .env и ОБЯЗАТЕЛЬНО задайте MENO_JWT_SECRET
#      (python -c "import secrets; print(secrets.token_urlsafe(48))").
#   2) docker compose up -d --build
#   Сервер без уникального секрета не стартует (защита P0): compose это проверяет.
#
# MinIO опционален: без MENO_S3_ENDPOINT ядро хранит файлы локально в volume uploads_data.

name: meno

services:
  db:
    image: postgres:16-alpine
    container_name: meno-db
    restart: always
    environment:
      POSTGRES_USER: ${MENO_PG_USER:-meno_user}
      POSTGRES_PASSWORD: ${MENO_PG_PASSWORD:?задайте MENO_PG_PASSWORD в .env}
      POSTGRES_DB: ${MENO_PG_DB:-meno_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - meno-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MENO_PG_USER:-meno_user} -d ${MENO_PG_DB:-meno_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: meno-redis
    restart: always
    # AOF-persistence: кеш/лимитеры/WS-шина переживают рестарт контейнера
    command: redis-server --appendonly yes --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    networks:
      - meno-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-58Z
    container_name: meno-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9000:9000"   # S3 API (наружу только через nginx)
      - "127.0.0.1:9001:9001"   # веб-консоль
    networks:
      - meno-network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Однократная задача: создать bucket meno-uploads в MinIO
  createbuckets:
    image: minio/mc:RELEASE.2025-04-21T19-56-19Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin} &&
      mc mb --ignore-existing local/${MENO_S3_BUCKET:-meno-uploads} &&
      echo 'bucket ready'
      "
    networks:
      - meno-network

  app:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: meno-server
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      MENO_DATABASE_URL: postgresql+asyncpg://${MENO_PG_USER:-meno_user}:${MENO_PG_PASSWORD}@db:5432/${MENO_PG_DB:-meno_db}
      MENO_REDIS_URL: redis://redis:6379/0
      # P0: секрет ОБЯЗАТЕЛЕН — пустое значение остановит контейнер на alembic/uvicorn старте
      MENO_JWT_SECRET: "${MENO_JWT_SECRET:?P0: секрет обязателен, сгенерируйте secrets.token_urlsafe(48)}"
      MENO_ADMIN_USERNAME: ${MENO_ADMIN_USERNAME:-owner}
      # Объектное хранилище: включите профиль MinIO, закомментированные строки ниже
      # MENO_S3_ENDPOINT: http://minio:9000
      # MENO_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      # MENO_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      # MENO_S3_USE_SSL: "false"
      MENO_S3_BUCKET: ${MENO_S3_BUCKET:-meno-uploads}
      MENO_UPLOAD_DIR: /app/server/uploads
      MENO_CORS_ORIGINS: ${MENO_CORS_ORIGINS:-}
      MENO_SENTRY_DSN: ${MENO_SENTRY_DSN:-}
    ports:
      - "127.0.0.1:8000:8000"   # наружу только через reverse-proxy (nginx/caddy)
    volumes:
      - uploads_data:/app/server/uploads
    networks:
      - meno-network

networks:
  meno-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
  uploads_data:
