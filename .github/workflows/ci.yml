# MeNo Messenger — строгий блокирующий CI (Этапы 0.7, 6.1 ТЗ).
# Merge в main возможен только при зелёном прогоне всех jobs (branch protection).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ------------------------------------------------------------------
  # 1. Security: скан истории и рабочего дерева на секреты (gitleaks)
  # ------------------------------------------------------------------
  security:
    name: Security (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # полный history — секреты ищутся и в коммитах

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # ------------------------------------------------------------------
  # 2. Lint: ruff check + ruff format --check (единый стиль импортов, A1/A2)
  # ------------------------------------------------------------------
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.9.1

      - name: Ruff check (server, tests)
        run: ruff check server/ tests/

      - name: Ruff format check
        run: ruff format --check server/ tests/

  # ------------------------------------------------------------------
  # 3. Tests: PostgreSQL 16 + Redis 7 как service-контейнеры, pytest с
  #    покрытием --cov-fail-under=70 (Этап 6.2). Матрица: PG-прод и SQLite.
  # ------------------------------------------------------------------
  test:
    name: Tests (${{ matrix.db }})
    runs-on: ubuntu-latest
    needs: [lint]
    strategy:
      fail-fast: false
      matrix:
        db: [postgres, sqlite]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: meno
          POSTGRES_PASSWORD: meno_ci_password
          POSTGRES_DB: meno_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meno -d meno_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      MENO_DEV_ENV: "1"
      MENO_DATABASE_URL: ${{ matrix.db == 'postgres' && 'postgresql+asyncpg://meno:meno_ci_password@localhost:5432/meno_test' || 'sqlite+aiosqlite:///./meno_test.db' }}
      MENO_REDIS_URL: "redis://localhost:6379/0"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt

      - name: Apply migrations (alembic upgrade head)
        if: matrix.db == 'postgres'
        run: alembic -x dburl="$MENO_DATABASE_URL" upgrade head

      - name: Run pytest with coverage gate
        run: >
          pytest server/tests tests
          --cov=server --cov-report=term-missing --cov-report=xml
          --cov-fail-under=70
          -q --maxfail=10

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.db }}
          path: coverage.xml
          retention-days: 14

  # ------------------------------------------------------------------
  # 4. Docker: проверка сборки production-образа сервера (A14)
  # ------------------------------------------------------------------
  docker:
    name: Build server image
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - name: Build Dockerfile
        run: docker build -t meno-server:ci ./server
      - name: Smoke-run container
        run: |
          docker run --rm -d --name meno-smoke \
            -e MENO_JWT_SECRET="$(python3 -c 'import secrets;print(secrets.token_urlsafe(48))')" \
            -e MENO_DATABASE_URL="sqlite+aiosqlite:////tmp/meno.db" \
            -p 8000:8000 meno-server:ci
          for i in $(seq 1 30); do
            sleep 2
            if curl -fsS http://localhost:8000/api/health >/dev/null 2>&1; then exit 0; fi
          done
          docker logs meno-smoke
          exit 1
