<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>MeNo — логотип</title>
<style>
  body { margin: 0; display: flex; font-family: Segoe UI, Arial, sans-serif; }
  .card { flex: 1; min-height: 100vh; display: flex; flex-direction: column;
          align-items: center; justify-content: center; gap: 18px; }
  .dark { background: #0B0E14; color: #00E5FF; }
  .light { background: #F6F8FB; color: #081A21; }
  img { width: 220px; height: 220px; border-radius: 28px;
        box-shadow: 0 12px 40px rgba(0,0,0,.35); }
  .name { font-size: 42px; font-weight: 800; letter-spacing: 6px; }
  .sub { opacity: .75; font-size: 14px; letter-spacing: 2px; }
</style>
</head>
<body>
  <div class="card dark">
    <img src="logo_dark.png" alt="MeNo dark">
    <div class="name">MENO</div>
    <div class="sub">ТЁМНАЯ ТЕМА</div>
  </div>
  <div class="card light">
    <img src="logo_light.png" alt="MeNo light">
    <div class="name">MENO</div>
    <div class="sub">СВЕТЛАЯ ТЕМА</div>
  </div>
</body>
</html>
