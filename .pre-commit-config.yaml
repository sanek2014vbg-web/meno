# Pre-commit hooks: автоматический контроль качества перед каждым коммитом.
# Установка: pip install pre-commit && pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: ["--maxkb=512"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      # Линтинг с автоисправлением (F/E/I/UP/B)
      - id: ruff
        args: ["--fix", "--exit-non-zero-on-fix"]
      # Форматирование (черный-совместимый стиль, тот же что в CI)
      - id: ruff-format

  # Сканирование на утечку секретов (пароли, API-ключи, токены) до коммита.
  # Ложные срабатывания на фейковые ключи в тестовых данных и примерах
  # исключаются через .gitleaks.toml (allowlist) + exclude-паттерны хука.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks
        args: ["--config=.gitleaks.toml", "--redact"]
        exclude: >
          (?x)^(
              tests/.*|
              server/tests/.*|
              client/tests/.*|
              conftest\.py|
              .*\.env\.example
          )$
